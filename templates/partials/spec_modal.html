<div style="padding: 1.5rem;">

  <!-- 標題列 -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; padding-bottom:0.75rem; border-bottom:1px solid var(--voc-border);">
    <h4 style="margin:0; font-size:1rem; font-weight:700; color:var(--voc-text);">規格維護</h4>
    <button onclick="document.getElementById('voc-modal').close()"
            style="background:none; border:none; font-size:1.25rem; cursor:pointer; color:var(--voc-text-muted); line-height:1;">✕</button>
  </div>

  <div style="overflow-x:auto;">
    <table class="dashboard-table" style="font-size:0.8rem;">
      <thead>
        <tr>
          <th>廠區</th>
          <th>項目</th>
          <th>來源</th>
          <th class="spec-boundary">法規許可值</th>
          <th style="color:var(--status-red);">OOS</th>
          <th style="color:var(--status-orange);">OOC</th>
          <th style="color:var(--status-yellow);">Alert</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        {% for item in specs %}
        <tr>
          <td style="font-weight:700;">{{ item.plantno }}</td>
          <td class="item-name">{{ item.item }}</td>
          <td>
            <span style="font-size:0.7rem; padding:.15rem .4rem; border-radius:3px; background:var(--data-scada); color:var(--voc-text);">
              {{ item.source or '—' }}
            </span>
          </td>
          <td class="spec-boundary">{{ item.LAW or '—' }}</td>
          <td style="color:var(--status-red); font-weight:600;">{{ item.OOS or '—' }}</td>
          <td style="color:var(--status-orange); font-weight:600;">{{ item.OOC or '—' }}</td>
          <td style="color:var(--status-yellow); font-weight:600;">{{ item.alert or '—' }}</td>
          <td>
            <button class="btn-voc btn-voc-outline" style="font-size:0.7rem; padding:.2rem .5rem;">編輯</button>
          </td>
        </tr>
        {% else %}
        <tr>
          <td colspan="8" style="text-align:center; padding:2rem; color:var(--voc-text-muted);">暫無資料</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div style="display:flex; justify-content:flex-end; margin-top:1rem;">
    <button onclick="document.getElementById('voc-modal').close()" class="btn-voc btn-voc-outline">關閉</button>
  </div>

</div>
