<div style="padding: 1.5rem;">

  <!-- 標題列 -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; padding-bottom:0.75rem; border-bottom:1px solid var(--voc-border);">
    <h4 style="margin:0; font-size:1rem; font-weight:700; color:var(--voc-text);">簽核管理</h4>
    <button onclick="document.getElementById('voc-modal').close()"
            style="background:none; border:none; font-size:1.25rem; cursor:pointer; color:var(--voc-text-muted); line-height:1;">✕</button>
  </div>

  <p style="font-size:0.8rem; color:var(--voc-text-muted); margin-bottom:1rem;">
    待您簽核的廠區隔離申請單。
  </p>

  <div style="overflow-x:auto;">
    <table class="dashboard-table" style="font-size:0.8rem;">
      <thead>
        <tr>
          <th>申請單號</th>
          <th>廠區</th>
          <th>申請人</th>
          <th>類型</th>
          <th>原因</th>
          <th>申請時間</th>
          <th>狀態</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        {% for item in todos %}
        <tr>
          <td style="font-family:var(--font-mono);">{{ item.ccno }}</td>
          <td style="font-weight:700;">{{ item.plantno }}</td>
          <td>{{ item.empstr }}</td>
          <td>{{ item.ttype }}</td>
          <td style="text-align:left;">{{ item.mdfdesc }}</td>
          <td style="font-family:var(--font-mono); font-size:0.75rem; color:var(--voc-text-muted);">
            {{ item.ctime.strftime('%m/%d %H:%M') if item.ctime else '—' }}
          </td>
          <td>
            <span style="font-size:0.7rem; padding:.15rem .4rem; border-radius:3px; background:var(--status-yellow-bg); color:var(--status-yellow);">
              {{ item.fstatus }}
            </span>
          </td>
          <td>
            <div style="display:flex; gap:.3rem; justify-content:center;">
              <button class="btn-voc btn-voc-primary" style="font-size:0.7rem; padding:.2rem .5rem;"
                      hx-post="/flow/sign"
                      hx-ext="json-enc"
                      hx-vals='{"form_no": "{{ item.ccno }}", "action": "approve"}'
                      hx-on::after-request="if(event.detail.successful){ alert('簽核成功！'); location.reload(); }">
                核准
              </button>
              <button class="btn-voc btn-voc-danger" style="font-size:0.7rem; padding:.2rem .5rem;"
                      hx-post="/flow/sign"
                      hx-ext="json-enc"
                      hx-vals='{"form_no": "{{ item.ccno }}", "action": "reject"}'
                      hx-on::after-request="if(event.detail.successful){ alert('已退回！'); location.reload(); }">
                退回
              </button>
            </div>
          </td>
        </tr>
        {% else %}
        <tr>
          <td colspan="8" style="text-align:center; padding:2rem; color:var(--voc-text-muted);">
            ✅ 目前沒有待簽核的申請單
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div style="display:flex; justify-content:flex-end; margin-top:1rem;">
    <button onclick="document.getElementById('voc-modal').close()" class="btn-voc btn-voc-outline">關閉</button>
  </div>

</div>
