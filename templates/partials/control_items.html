{% if items %}
<div style="display:flex; flex-wrap:wrap; gap:.4rem; padding:.25rem 0;">
  {% for it in items %}
  <label style="display:inline-flex; align-items:center; gap:.35rem; cursor:pointer;
                background:var(--voc-bg-main); border:1px solid var(--voc-border);
                border-radius:6px; padding:.3rem .65rem; font-size:0.82rem;
                user-select:none;">
    <input type="checkbox" class="item-checkbox"
           data-item="{{ it.item }}"
           data-sourceid="{{ it.sourceid }}"
           style="cursor:pointer; accent-color:var(--voc-primary);">
    {{ it.item }}
    {% if it.unit %}
    <span style="font-size:0.7rem; color:var(--voc-text-muted);">({{ it.unit }})</span>
    {% endif %}
  </label>
  {% endfor %}
</div>
{% elif plantno %}
<p style="font-size:0.8rem; color:var(--voc-text-muted); margin:.25rem 0;">此廠區無可隔離項目</p>
{% else %}
<p style="font-size:0.8rem; color:var(--voc-text-muted); margin:.25rem 0;">請先選擇廠區</p>
{% endif %}
