<div class="modal-header border-0 pb-0">
    <h4 class="modal-title fw-bold text-success">⚙️ 規格參數維護 (Spec Config)</h4>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body py-4">
    <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-primary px-4 fw-semibold rounded-pill shadow-sm">➕ 新增規格參數</button>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle shadow-sm rounded-3 overflow-hidden">
            <thead class="table-light">
                <tr>
                    <th>廠區</th>
                    <th>項目</th>
                    <th>來源</th>
                    <th>LAW</th>
                    <th>OOS</th>
                    <th>OOC</th>
                    <th>Alert</th>
                    <th class="text-center">操作</th>
                </tr>
            </thead>
            <tbody>
                {% for item in specs %}
                <tr>
                    <td class="fw-bold">{{ item.plantno }}</td>
                    <td>{{ item.item }}</td>
                    <td><span class="badge bg-secondary">{{ item.source }}</span></td>
                    <td class="text-dark fw-semibold bg-light">{{ item.LAW }}</td>
                    <td class="text-danger fw-bold">{{ item.OOS }}</td>
                    <td class="text-warning fw-bold">{{ item.OOC }}</td>
                    <td class="text-muted">{{ item.alert }}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary rounded-pill px-3">編輯</button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="8" class="text-center py-4">暫無資料</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<div class="modal-footer border-0">
    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">關閉</button>
</div>
